refresh:
  name: Refresh
  description:
    Re-read the vehicle's state from the servers. Does not contact the vehicle,
    so it costs nothing and can be called as often as you like - but it only
    returns what the servers already hold. Use Poll vehicle to make the vehicle
    upload something newer.
  fields:
    vehicle:
      description:
        Device (vehicle) you wish to refresh data for.
      required: true
      selector:
        device:
          integration: toyota_na
poll_vehicle:
  name: Poll vehicle
  description:
    Wake the vehicle's telematics unit and tell it to upload fresh state, then
    re-read it. This is the only part of the integration that draws on the 12V
    battery, so prefer it deliberately over a short automatic interval on a
    vehicle that sits parked and unplugged.
  fields:
    vehicle:
      description:
        Device (vehicle) you wish to wake.
      required: true
      selector:
        device:
          integration: toyota_na
send_command:
  name: Send raw command (advanced)
  description:
    Send an arbitrary command string straight to the vehicle. Diagnostic tool for
    identifying commands the integration does not yet know - the gateway's
    vocabulary is undocumented and differs between brands. An unrecognised
    command returns HTTP 400. Be deliberate about what you send; the vocabulary
    includes things like power-window-open.
  fields:
    vehicle:
      description:
        Device (vehicle) to send the command to.
      required: true
      selector:
        device:
          integration: toyota_na
    command:
      description:
        Raw command string, for example "buzzer-warning" or "sound-horn".
      required: true
      example: buzzer-warning
      selector:
        text:
